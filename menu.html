<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee house</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a class="logo" href="index.html" aria-label="Resource Coffee House, home">
                    <img src="assets/logo.png" alt="">
                </a>
                <nav class="navbar">
                    <ul class="nav-list">
                        <li class="nav-item"><a href="index.html#favorite">Favorite coffee</a></li>
                        <li class="nav-item"><a href="index.html#about">About</a></li>
                        <li class="nav-item"><a href="index.html#app">Mobile app</a></li>
                        <li class="nav-item"><a href="index.html#contacts">Contact us</a></li>
                    </ul>
                </nav>
                <a class="menu-link" href="menu.html">Menu
                    <img src="assets/coffee-cup.svg" alt="">
                </a>
                <button class="burger" type="button" aria-label="Open menu" aria-expanded="false">
                    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" aria-hidden="true">
                        <circle cx="22" cy="22" r="21.5" stroke="currentColor" />
                        <path class="burger__lines" d="M14 19h16M14 25h16" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" />
                        <path class="burger__close" d="M16 16l12 12M28 16L16 28" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

</body>

</html>
